<svg width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff">
        <animate attributeName="stop-color" values="#00d9ff;#9d4edd;#ff006e;#00d9ff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#9d4edd">
        <animate attributeName="stop-color" values="#9d4edd;#ff006e;#00d9ff;#9d4edd" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff006e">
        <animate attributeName="stop-color" values="#ff006e;#00d9ff;#9d4edd;#ff006e" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 3D shadow layer -->
  <rect x="5" y="5" width="790" height="90" rx="14" fill="#9d4edd" opacity="0.15" filter="url(#glow)"/>
  <!-- Main background -->
  <rect width="800" height="100" rx="12" fill="url(#bg)"/>
  <!-- Glowing animated border -->
  <rect x="1.5" y="1.5" width="797" height="97" rx="11" fill="none" stroke="url(#border)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Inner highlight line (3D effect top) -->
  <line x1="20" y1="3" x2="780" y2="3" stroke="url(#border)" stroke-width="1" opacity="0.4"/>
  <!-- Emoji -->
  <text x="38" y="58" font-size="32" text-anchor="middle" filter="url(#glow)">😄
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <!-- Joke text -->
  <text x="420" y="42" font-size="16" font-family="monospace" font-weight="bold" text-anchor="middle" fill="#00d9ff" filter="url(#textglow)">
    Why do programmers prefer dark mode?
    <animate attributeName="fill" values="#00d9ff;#9d4edd;#00d9ff" dur="4s" repeatCount="indefinite"/>
  </text>
  <!-- Punchline -->
  <text x="420" y="68" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle" fill="#ff006e" filter="url(#textglow)">
    Because light attracts bugs! 🐛
    <animate attributeName="fill" values="#ff006e;#ffcc00;#ff006e" dur="3s" repeatCount="indefinite"/>
  </text>
  <!-- Subtitle -->
  <text x="420" y="88" font-size="10" font-family="monospace" text-anchor="middle" fill="#8b949e">
    ⚡ AI Developer Humor — Abdullah Javid
  </text>
  <!-- 3D corner accents -->
  <circle cx="12" cy="12" r="3" fill="#00d9ff" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="788" cy="12" r="3" fill="#9d4edd" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="88" r="3" fill="#ff006e" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="788" cy="88" r="3" fill="#00ff88" opacity="0.7" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
