<svg xmlns="http://www.w3.org/2000/svg" width="210" height="54">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00d9ff" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>
  <!-- Glow shadow base -->
  <rect x="5" y="8" rx="12" ry="12" width="200" height="42" fill="#00d9ff" opacity="0.12"/>
  <!-- Border gradient (slightly larger) -->
  <rect x="0" y="2" rx="14" ry="14" width="210" height="50" fill="url(#border)" filter="url(#glow)" opacity="0.7"/>
  <!-- Main button body -->
  <rect x="1.5" y="3.5" rx="13" ry="13" width="207" height="47" fill="url(#bg)"/>
  <!-- Top shine highlight -->
  <rect x="4" y="5" rx="11" ry="11" width="202" height="22" fill="white" opacity="0.05"/>
  <!-- Bottom 3D edge -->
  <rect x="4" y="44" rx="4" ry="4" width="202" height="4" fill="#00d9ff" opacity="0.15"/>
  <!-- Icon -->
  <text x="32" y="33" font-family="Segoe UI Emoji, Arial" font-size="18" text-anchor="middle">📊</text>
  <!-- Label -->
  <text x="120" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#00d9ff" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">GITHUB STATS</text>
</svg>
